# Production Docker Compose — Oracle Cloud VM
# Đặt file này tại ~/app/docker-compose.prod.yml trên Oracle VM
# Chạy: docker compose -f ~/app/docker-compose.prod.yml up -d
#
# Tạo .env cùng folder với các biến bên dưới trước khi chạy

services:

  # ── API Gateway (port 5000) ────────────────────────────────────────────────
  gateway:
    image: ghcr.io/${GHCR_USERNAME}/apigateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5000
      - FE_ORIGIN=${FE_ORIGIN}
      - OpenTelemetry__ExportEndpoint=http://10.0.0.94:4317   # OTLP trace → Tempo (VM2)
    labels:
      - "env=prod"
    networks:
      - fishlover_prod

  # ── UserManagement (port 8080) ────────────────────────────────────────────
  usermanagement:
    image: ghcr.io/${GHCR_USERNAME}/usermanagement-api:latest
    container_name: usermanagement
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=usermanagement;Username=${UM_DB_USER};Password=${UM_DB_PASSWORD}
      - ConnectionStrings__Redis=${REDIS_CONN}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInDays=${JWT_EXPIRY_DAYS}
      - AutoMigrate__OnStartup=false
      - Seeding__SeedInitialAdmin=${SEED_INITIAL_ADMIN}
      - EmailSettings__Resend__ApiKey=${EMAIL_API_KEY}
      - RequireInvitation=${REQUIRE_INVITATION}
      - InitialAdmin__Email=${INITIAL_ADMIN_EMAIL}
      - InitialAdmin__Password=${INITIAL_ADMIN_PASSWORD}
      - OpenIddict__Issuer=${OIDC_ISSUER}
      - OpenIddict__KeyDir=/openiddict-keys
      - AllowedOrigins__0=${FE_ORIGIN}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - OpenTelemetry__ExportEndpoint=http://10.0.0.94:4317   # OTLP trace → Tempo (VM2)
    volumes:
      - openiddict_keys:/openiddict-keys
    labels:
      - "env=prod"
    depends_on:
      - postgres
      - redis
    networks:
      - fishlover_prod

  # ── FishDex (port 8081) ───────────────────────────────────────────────────
  fishdex:
    image: ghcr.io/${GHCR_USERNAME}/fishdex-api:latest
    container_name: fishdex
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FishDexDb=Host=postgres;Port=5432;Database=fishdex;Username=${FD_DB_USER};Password=${FD_DB_PASSWORD}
      - Storage__Provider=r2
      - Storage__ServiceUrl=${FISHDEX_R2_SERVICE_URL}
      - Storage__AccessKey=${FISHDEX_R2_ACCESS_KEY}
      - Storage__SecretKey=${FISHDEX_R2_SECRET_KEY}
      - Storage__BucketName=${FISHDEX_R2_BUCKET_NAME}
      - Storage__ForcePathStyle=false
      - AuthServer__Url=${OIDC_ISSUER}
      - AuthServer__Authority=${OIDC_ISSUER}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins__0=${FE_ORIGIN}
      - AutoMigrate__OnStartup=true
      - ASPNETCORE_HTTP_PORTS=8081
      - OpenTelemetry__ExportEndpoint=http://10.0.0.94:4317   # OTLP trace → Tempo (VM2)
    labels:
      - "env=prod"
    depends_on:
      - postgres
    networks:
      - fishlover_prod

  # ── AquaHome (port 8082) ──────────────────────────────────────────────────
  aquahome:
    image: ghcr.io/${GHCR_USERNAME}/aquahome-api:latest
    container_name: aquahome
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=aquahome;Username=${AH_DB_USER};Password=${AH_DB_PASSWORD}
      - ConnectionStrings__Redis=${REDIS_CONN}
      - AuthServer__Url=${OIDC_ISSUER}
      - AuthServer__Authority=${OIDC_ISSUER}
      - AutoMigrate__OnStartup=true
      - Storage__Provider=r2
      - Storage__ServiceUrl=${AQUAHOME_R2_SERVICE_URL}
      - Storage__AccessKey=${AQUAHOME_R2_ACCESS_KEY}
      - Storage__SecretKey=${AQUAHOME_R2_SECRET_KEY}
      - Storage__BucketName=${AQUAHOME_R2_BUCKET_NAME}
      - Storage__Environment=${AQUAHOME_R2_ENV}
      - Storage__ForcePathStyle=false
      - ASPNETCORE_HTTP_PORTS=8082
      - OpenTelemetry__ExportEndpoint=http://10.0.0.94:4317   # OTLP trace → Tempo (VM2)
    labels:
      - "env=prod"
    depends_on:
      - postgres
      - redis
    networks:
      - fishlover_prod

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_ADMIN_PASSWORD}
      - UM_DB_USER=${UM_DB_USER}
      - UM_DB_PASSWORD=${UM_DB_PASSWORD}
      - FD_DB_USER=${FD_DB_USER}
      - FD_DB_PASSWORD=${FD_DB_PASSWORD}
      - AH_DB_USER=${AH_DB_USER}
      - AH_DB_PASSWORD=${AH_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - fishlover_prod

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fishlover_prod

  # ── Promtail (thu log Docker containers → đẩy sang Loki) ─────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - fishlover_prod

  # ── Node Exporter (metrics hệ thống cho Prometheus) ──────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      # Bind private IP: chỉ Prometheus VM2 (10.0.0.94) scrape qua subnet private, KHÔNG hở public
      - "10.0.0.64:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - fishlover_prod

  # ── cAdvisor (metrics Docker containers cho Prometheus) ───────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    ports:
      # Bind private IP: chỉ Prometheus VM2 scrape, KHÔNG hở public
      - "10.0.0.64:9200:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - fishlover_prod

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
    networks:
      - fishlover_prod

volumes:
  postgres_data:
  redis_data:
  openiddict_keys:

networks:
  fishlover_prod:
    driver: bridge
