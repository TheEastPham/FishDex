# Nginx reverse proxy — chỉ proxy đến ApiGateway
# FrontEnd chạy trên Cloudflare Pages, không serve static ở đây

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy toàn bộ traffic đến ApiGateway
server {
    listen 443 ssl;
    server_name <YOUR_DOMAIN>;          # VD: api.fishlover.xyz

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s;

    # IP thật của người dùng. Domain bật Cloudflare proxy (đám mây cam) nên mọi kết nối tới đây đến từ
    # edge Cloudflare — $remote_addr chỉ là vài IP edge dùng chung. CF-Connecting-IP chỉ được tin khi kết
    # nối đến từ dải IP Cloudflare; ai gọi thẳng IP VM thì header đó bị bỏ qua, $remote_addr giữ IP thật
    # của họ → không giả được IP.
    # Dải IP lấy từ https://api.cloudflare.com/client/v4/ips (2026-11-12). Cloudflare thêm dải mới mà
    # không cập nhật ở đây thì user đi qua dải đó sẽ bị đếm theo IP edge (dùng chung bộ đếm), không hỏng hẳn.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header   CF-Connecting-IP;

    # Header gửi xuống gateway — khai ở cấp server để mọi location kế thừa. Bẫy của nginx: location nào
    # tự khai dù chỉ 1 proxy_set_header là mất HẾT các dòng dưới đây, phải chép lại đủ.
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-Host  $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    # Ghi đè chứ không nối ($proxy_add_x_forwarded_for): phần client tự gửi lên giả được, mà
    # AnonSpeciesQuotaFilter bên FishDex lấy phần tử đầu tiên làm IP để đếm hạn mức khách.
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Ocelot rate limit đếm theo header ClientId (RateLimitOptions.ClientIdHeader mặc định). Thiếu header
    # thì mọi request là client "client" → mỗi route 1 bộ đếm cho CẢ SITE: 1 script 20 req/phút vào
    # /connect là khoá đăng nhập của mọi người. proxy_set_header thay hẳn header cùng tên client gửi lên.
    proxy_set_header   ClientId          $remote_addr;

    # Rewrite internal container URLs in OIDC discovery document
    location /.well-known/ {
        set $upstream http://gateway:5000;
        proxy_pass         $upstream;

        sub_filter         'https://usermanagement:8080' 'https://api.fishlover.org';
        sub_filter         'http://usermanagement:8080'  'https://api.fishlover.org';
        sub_filter_once    off;
        sub_filter_types   application/json;
    }

    # Chặn /metrics ra internet. `location /` proxy toàn bộ vào gateway, mà gateway có endpoint
    # Prometheus → nếu không chặn thì https://<domain>/metrics phơi metric + danh sách route.
    # Prometheus VM2 scrape trực tiếp qua private IP 10.0.0.64:5000, không đi qua nginx.
    location = /metrics {
        return 404;
    }

    location / {
        set $upstream http://gateway:5000;
        proxy_pass         $upstream;
    }
}
