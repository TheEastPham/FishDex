# Nginx reverse proxy — chỉ proxy đến ApiGateway
# FrontEnd chạy trên Cloudflare Pages, không serve static ở đây

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy toàn bộ traffic đến ApiGateway
server {
    listen 443 ssl;
    server_name <YOUR_DOMAIN>;          # VD: api.fishlover.xyz

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s;

    # Rewrite internal container URLs in OIDC discovery document
    location /.well-known/ {
        set $upstream http://gateway:5000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        sub_filter         'https://usermanagement:8080' 'https://api.fishlover.org';
        sub_filter         'http://usermanagement:8080'  'https://api.fishlover.org';
        sub_filter_once    off;
        sub_filter_types   application/json;
    }

    # Chặn /metrics ra internet. `location /` proxy toàn bộ vào gateway, mà gateway có endpoint
    # Prometheus → nếu không chặn thì https://<domain>/metrics phơi metric + danh sách route.
    # Prometheus VM2 scrape trực tiếp qua private IP 10.0.0.64:5000, không đi qua nginx.
    location = /metrics {
        return 404;
    }

    location / {
        set $upstream http://gateway:5000;
        proxy_pass         $upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
