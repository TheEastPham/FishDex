# Production Docker Compose — Oracle Cloud VM
# Đặt file này tại ~/app/docker-compose.prod.yml trên Oracle VM
# Chạy: docker compose -f ~/app/docker-compose.prod.yml up -d
#
# Tạo .env cùng folder với các biến bên dưới trước khi chạy

services:

  # ── API Gateway (port 5000) ────────────────────────────────────────────────
  gateway:
    image: ghcr.io/${GHCR_USERNAME}/apigateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - fishlover_prod

  # ── UserManagement (port 8080) ────────────────────────────────────────────
  usermanagement:
    image: ghcr.io/${GHCR_USERNAME}/usermanagement-api:latest
    container_name: usermanagement
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${USERMGMT_DB_CONN}
      - ConnectionStrings__Redis=${REDIS_CONN}
      - OpenIddict__Issuer=${OIDC_ISSUER}
    depends_on:
      - postgres
      - redis
    networks:
      - fishlover_prod

  # ── FishDex (port 8081) ───────────────────────────────────────────────────
  fishdex:
    image: ghcr.io/${GHCR_USERNAME}/fishdex-api:latest
    container_name: fishdex
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FishDexDb=${FISHDEX_DB_CONN}
      - Storage__ServiceUrl=${R2_SERVICE_URL}
      - Storage__AccessKey=${R2_ACCESS_KEY}
      - Storage__SecretKey=${R2_SECRET_KEY}
      - Storage__BucketName=${R2_BUCKET_NAME}
      - AuthServer__Url=${OIDC_ISSUER}
      - AuthServer__Authority=${OIDC_ISSUER}
    depends_on:
      - postgres
    networks:
      - fishlover_prod

  # ── AquaHome (port 8082) ──────────────────────────────────────────────────
  aquahome:
    image: ghcr.io/${GHCR_USERNAME}/aquahome-api:latest
    container_name: aquahome
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${AQUAHOME_DB_CONN}
      - ConnectionStrings__Redis=${REDIS_CONN}
      - AuthServer__Url=${OIDC_ISSUER}
    depends_on:
      - postgres
      - redis
    networks:
      - fishlover_prod

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${PG_USER}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fishlover_prod

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fishlover_prod

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # cert từ Let's Encrypt
    depends_on:
      - gateway
    networks:
      - fishlover_prod

volumes:
  postgres_data:
  redis_data:

networks:
  fishlover_prod:
    driver: bridge
