# Production Docker Compose — Oracle Cloud VM
# Đặt file này tại ~/app/docker-compose.prod.yml trên Oracle VM
# Chạy: docker compose -f ~/app/docker-compose.prod.yml up -d
#
# Tạo .env cùng folder với các biến bên dưới trước khi chạy

services:

  # ── API Gateway (port 5000) ────────────────────────────────────────────────
  gateway:
    image: ghcr.io/${GHCR_USERNAME}/apigateway:latest
    container_name: gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=5000
    networks:
      - fishlover_prod

  # ── UserManagement (port 8080) ────────────────────────────────────────────
  usermanagement:
    image: ghcr.io/${GHCR_USERNAME}/usermanagement-api:latest
    container_name: usermanagement
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=usermanagement;Username=${UM_DB_USER};Password=${UM_DB_PASSWORD}
      - ConnectionStrings__Redis=${REDIS_CONN}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - JwtSettings__ExpiryInDays=${JWT_EXPIRY_DAYS}
      - AutoMigrate__OnStartup=false
      - Seeding__SeedInitialAdmin=${SEED_INITIAL_ADMIN}
      - EmailSettings__Resend__ApiKey=${EMAIL_API_KEY}
      - RequireInvitation=${REQUIRE_INVITATION}
      - InitialAdmin__Email=${INITIAL_ADMIN_EMAIL}
      - InitialAdmin__Password=${INITIAL_ADMIN_PASSWORD}
      - OpenIddict__Issuer=${OIDC_ISSUER}
      - OpenIddict__KeyDir=/openiddict-keys
      - AllowedOrigins__0=${FE_ORIGIN}
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
    volumes:
      - openiddict_keys:/openiddict-keys
    depends_on:
      - postgres
      - redis
    networks:
      - fishlover_prod

  # ── FishDex (port 8081) ───────────────────────────────────────────────────
  fishdex:
    image: ghcr.io/${GHCR_USERNAME}/fishdex-api:latest
    container_name: fishdex
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__FishDexDb=Host=postgres;Port=5432;Database=fishdex;Username=${FD_DB_USER};Password=${FD_DB_PASSWORD}
      - Storage__Provider=r2
      - Storage__ServiceUrl=${R2_SERVICE_URL}
      - Storage__AccessKey=${R2_ACCESS_KEY}
      - Storage__SecretKey=${R2_SECRET_KEY}
      - Storage__BucketName=${R2_BUCKET_NAME}
      - Storage__ForcePathStyle=false
      - AuthServer__Url=${OIDC_ISSUER}
      - AuthServer__Authority=${OIDC_ISSUER}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Cors__AllowedOrigins__0=${FE_ORIGIN}
      - ASPNETCORE_HTTP_PORTS=8081
    depends_on:
      - postgres
    networks:
      - fishlover_prod

  # ── AquaHome (port 8082) ──────────────────────────────────────────────────
  aquahome:
    image: ghcr.io/${GHCR_USERNAME}/aquahome-api:latest
    container_name: aquahome
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=aquahome;Username=${AH_DB_USER};Password=${AH_DB_PASSWORD}
      - ConnectionStrings__Redis=${REDIS_CONN}
      - AuthServer__Url=${OIDC_ISSUER}
      - AuthServer__Authority=${OIDC_ISSUER}
      - ASPNETCORE_HTTP_PORTS=8082
    depends_on:
      - postgres
      - redis
    networks:
      - fishlover_prod

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_ADMIN_PASSWORD}
      - UM_DB_USER=${UM_DB_USER}
      - UM_DB_PASSWORD=${UM_DB_PASSWORD}
      - FD_DB_USER=${FD_DB_USER}
      - FD_DB_PASSWORD=${FD_DB_PASSWORD}
      - AH_DB_USER=${AH_DB_USER}
      - AH_DB_PASSWORD=${AH_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - fishlover_prod

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - fishlover_prod

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - gateway
    networks:
      - fishlover_prod

volumes:
  postgres_data:
  redis_data:
  openiddict_keys:

networks:
  fishlover_prod:
    driver: bridge
