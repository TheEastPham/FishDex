# AquaHome API — Build & Deploy to Oracle Cloud VM
# Trigger: push lên release/v1.0 + thay đổi trong AquaHome hoặc Share

trigger:
  branches:
    include:
      - release/v1.0
  paths:
    include:
      - BackEndProject/AquaHome/**
      - BackEndProject/Share/**
    exclude:
      - '**/*.md'
pr: none

variables:
  - group: oracle-prod-secrets
  - name: IMAGE
    value: ghcr.io/$(GHCR_USERNAME)/aquahome-api
  - name: WORKER_IMAGE
    value: ghcr.io/$(GHCR_USERNAME)/aquahome-worker
  - name: SERVICE
    value: aquahome

stages:

- stage: Build
  displayName: Build & Push
  jobs:
  - job: BuildPush
    displayName: Build Docker image → GHCR
    pool:
      vmImage: ubuntu-latest
    steps:

    - script: echo "$(GHCR_TOKEN)" | docker login ghcr.io -u "$(GHCR_USERNAME)" --password-stdin
      displayName: Login GHCR

    - script: |
        docker buildx create --use --driver docker-container
        docker buildx build \
          --platform linux/arm64 \
          --push \
          -f Pipeline/local/AquaHome/Dockerfile.api \
          -t $(IMAGE):$(Build.BuildId) \
          -t $(IMAGE):latest \
          BackEndProject/
      displayName: Build & Push API image (ARM64)

    - script: |
        docker buildx build \
          --platform linux/arm64 \
          --push \
          -f Pipeline/local/AquaHome/Dockerfile.worker \
          -t $(WORKER_IMAGE):$(Build.BuildId) \
          -t $(WORKER_IMAGE):latest \
          BackEndProject/
      displayName: Build & Push Worker image (ARM64)

- stage: Deploy
  displayName: Deploy → Oracle VM
  dependsOn: Build
  jobs:
  - deployment: DeployProd
    displayName: SSH deploy
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "$(ORACLE_SSH_KEY)" | base64 -d > /tmp/oracle.key
              chmod 600 /tmp/oracle.key
            displayName: Setup SSH key

          - script: |
              ssh -i /tmp/oracle.key -o StrictHostKeyChecking=no ubuntu@$(ORACLE_VM_IP) "
                echo '$(GHCR_TOKEN)' | docker login ghcr.io -u '$(GHCR_USERNAME)' --password-stdin &&
                GHCR_USERNAME='$(GHCR_USERNAME)' docker compose -f ~/app/docker-compose.prod.yml pull $(SERVICE) aquahome-worker &&
                GHCR_USERNAME='$(GHCR_USERNAME)' docker compose -f ~/app/docker-compose.prod.yml up -d --no-deps $(SERVICE) aquahome-worker &&
                echo 'Deploy $(SERVICE) + worker done'
              "
            displayName: Pull & restart AquaHome

          - script: rm -f /tmp/oracle.key
            displayName: Cleanup SSH key
            condition: always()
