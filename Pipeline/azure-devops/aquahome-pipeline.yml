# AquaHome API — Build & Deploy to Oracle Cloud VM
# Trigger: push lên release/v1.0 + thay đổi trong AquaHome hoặc Share

trigger:
  branches:
    include:
      - release/v1.0
  paths:
    include:
      - BackEndProject/AquaHome/**
      - BackEndProject/Share/**
    exclude:
      - '**/*.md'
pr: none

variables:
  - group: oracle-prod-secrets
  - name: IMAGE
    value: ghcr.io/$(GHCR_USERNAME)/aquahome-api
  - name: SERVICE
    value: aquahome

stages:

- stage: Build
  displayName: Build & Push
  jobs:
  - job: BuildPush
    displayName: Build Docker image → GHCR
    pool:
      vmImage: ubuntu-latest
    steps:

    - script: echo "$(GHCR_TOKEN)" | docker login ghcr.io -u "$(GHCR_USERNAME)" --password-stdin
      displayName: Login GHCR

    - script: |
        docker build \
          -f Pipeline/local/AquaHome/Dockerfile.api \
          -t $(IMAGE):$(Build.BuildId) \
          -t $(IMAGE):latest \
          BackEndProject/
      displayName: Build image

    - script: |
        docker push $(IMAGE):$(Build.BuildId)
        docker push $(IMAGE):latest
      displayName: Push to GHCR

- stage: Deploy
  displayName: Deploy → Oracle VM
  dependsOn: Build
  jobs:
  - deployment: DeployProd
    displayName: SSH deploy
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "$(ORACLE_SSH_KEY)" > /tmp/oracle.key
              chmod 600 /tmp/oracle.key
            displayName: Setup SSH key

          - script: |
              ssh -i /tmp/oracle.key -o StrictHostKeyChecking=no ubuntu@$(ORACLE_VM_IP) \
                "echo '$(GHCR_TOKEN)' | docker login ghcr.io -u '$(GHCR_USERNAME)' --password-stdin && \
                 docker compose -f ~/app/docker-compose.prod.yml pull $(SERVICE) && \
                 docker compose -f ~/app/docker-compose.prod.yml up -d --no-deps $(SERVICE) && \
                 echo 'Deploy $(SERVICE) done'"
            displayName: Pull & restart AquaHome

          - script: rm -f /tmp/oracle.key
            displayName: Cleanup SSH key
            condition: always()
