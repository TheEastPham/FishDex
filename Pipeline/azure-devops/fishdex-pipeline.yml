# FishDex API — Build & Deploy to Oracle Cloud VM
# Trigger: push lên release/v1.0 + thay đổi trong FishDex hoặc Share
# Deploy: build Docker image → push GHCR → SSH Oracle VM → docker compose up

trigger:
  branches:
    include:
      - release/v1.0
  paths:
    include:
      - BackEndProject/FishDex/**
      - BackEndProject/Share/**
    exclude:
      - '**/*.md'
pr: none

variables:
  - group: oracle-prod-secrets   # ORACLE_VM_IP, ORACLE_SSH_KEY, GHCR_TOKEN, GHCR_USERNAME
  - name: IMAGE
    value: ghcr.io/$(GHCR_USERNAME)/fishdex-api
  - name: SERVICE
    value: fishdex

stages:

# ── Build + Push image lên GHCR ─────────────────────────────────────────────
- stage: Build
  displayName: Build & Push
  jobs:
  - job: BuildPush
    displayName: Build Docker image → GHCR
    pool:
      vmImage: ubuntu-latest
    steps:

    - script: echo "$(GHCR_TOKEN)" | docker login ghcr.io -u "$(GHCR_USERNAME)" --password-stdin
      displayName: Login GHCR

    - script: |
        docker buildx create --use --driver docker-container
        docker buildx build \
          --platform linux/arm64 \
          --push \
          -f Pipeline/local/FishDex/Dockerfile.api \
          -t $(IMAGE):$(Build.BuildId) \
          -t $(IMAGE):latest \
          BackEndProject/
      displayName: Build & Push image (ARM64)

# ── Deploy lên Oracle VM ─────────────────────────────────────────────────────
- stage: Deploy
  displayName: Deploy → Oracle VM
  dependsOn: Build
  jobs:
  - deployment: DeployProd
    displayName: SSH deploy
    environment: production
    pool:
      vmImage: ubuntu-latest
    strategy:
      runOnce:
        deploy:
          steps:

          - script: |
              echo "$(ORACLE_SSH_KEY)" | base64 -d > /tmp/oracle.key
              chmod 600 /tmp/oracle.key
            displayName: Setup SSH key

          - script: |
              ssh -i /tmp/oracle.key -o StrictHostKeyChecking=no ubuntu@$(ORACLE_VM_IP) \
                "echo '$(GHCR_TOKEN)' | docker login ghcr.io -u '$(GHCR_USERNAME)' --password-stdin && \
                 docker compose -f ~/app/docker-compose.prod.yml pull $(SERVICE) && \
                 docker compose -f ~/app/docker-compose.prod.yml up -d --no-deps $(SERVICE) && \
                 echo 'Deploy $(SERVICE) done'"
            displayName: Pull & restart FishDex

          - script: rm -f /tmp/oracle.key
            displayName: Cleanup SSH key
            condition: always()
