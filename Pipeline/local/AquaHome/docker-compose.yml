version: "3.9"

# ─────────────────────────────────────────────────────────────
# AquaHome — Local Dev Stack
# SQL Server 2022 + Redis 7
# Ports offset +1 để chạy song song với UserManagementLocal
# ─────────────────────────────────────────────────────────────

services:

  aquahome-db:
    image: postgres:16-alpine
    container_name: aquahome_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: AquaHome
      POSTGRES_USER: aquahome
      POSTGRES_PASSWORD: "AquaHome_Local_Pwd1!"
    ports:
      - "5434:5432"
    volumes:
      - aquahome_sqldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquahome -d AquaHome"]
      interval: 10s
      timeout: 5s
      retries: 5

  aquahome-redis:
    image: redis:7-alpine
    container_name: aquahome_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aquahome-api:
    build:
      context: ../../../BackEndProject
      dockerfile: ../Pipeline/local/AquaHome/Dockerfile.api
    image: aquahome-api:local
    container_name: aquahome_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: ${AQUAHOME_DB_CONN}
      JwtSettings__SecretKey:  ${JWT_SECRET_KEY}
      JwtSettings__Issuer:     ${JWT_ISSUER}
      JwtSettings__Audience:   ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes: ${JWT_EXPIRY_MINUTES}
      AuthServer__Url:         ${AUTH_SERVER_URL}
      AuthServer__Authority:   ${AUTH_SERVER_AUTHORITY}
    ports:
      - "8082:8080"
    networks:
      - default
      - fishlover_local
    depends_on:
      aquahome-db:
        condition: service_healthy

volumes:
  aquahome_sqldata:

networks:
  fishlover_local:
    external: true
