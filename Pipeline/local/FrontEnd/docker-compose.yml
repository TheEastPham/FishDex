services:
  aquahome-web:
    build:
      context: ../../../FrontEnd
      dockerfile: apps/aquahome-web/Dockerfile
      args:
        VITE_GATEWAY_URL:          ${VITE_GATEWAY_URL:-http://localhost:5000}
        VITE_AUTH_CLIENT_ID:       ${VITE_AUTH_CLIENT_ID:-aquahome-fe}
        VITE_AUTH_REDIRECT_URI:    ${VITE_AUTH_REDIRECT_URI:-http://localhost:3000/callback}
        VITE_AUTH_POST_LOGOUT_URI: ${VITE_AUTH_POST_LOGOUT_URI:-http://localhost:3000}
    ports:
      - "3000:80"
    networks:
      - fishlover_local

networks:
  fishlover_local:
    external: true
    name: fishlover_local
