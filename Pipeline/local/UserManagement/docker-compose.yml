version: "3.9"

# ─────────────────────────────────────────────────────────────
# UserManagement — Local Dev Stack
# SQL Server 2022 + Redis 7 + UserManagement.API
# ─────────────────────────────────────────────────────────────

services:

  usermanagement-db:
    image: postgres:16-alpine
    container_name: usermanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: UserManagement
      POSTGRES_USER: usermanagement
      POSTGRES_PASSWORD: "UserMgmt_Local_Pwd1!"
    ports:
      - "5435:5432"
    volumes:
      - usermanagement_sqldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermanagement -d UserManagement"]
      interval: 10s
      timeout: 5s
      retries: 5

  usermanagement-redis:
    image: redis:7-alpine
    container_name: usermanagement_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  usermanagement-api:
    build:
      context: ../../../BackEndProject
      dockerfile: ../Pipeline/local/UserManagement/Dockerfile.api
    image: usermanagement-api:local
    container_name: usermanagement_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: ${UM_DB_CONN}
      ConnectionStrings__Redis:             ${REDIS_CONN}
      JwtSettings__SecretKey:               ${JWT_SECRET_KEY}
      JwtSettings__Issuer:                  ${JWT_ISSUER}
      JwtSettings__Audience:                ${JWT_AUDIENCE}
      JwtSettings__ExpiryInDays:            ${JWT_EXPIRY_DAYS}
      AutoMigrate__OnStartup:               "true"
      Seeding__SeedInitialAdmin:            ${SEED_INITIAL_ADMIN}
      EmailSettings__Resend__ApiKey:        ${EMAIL_API_KEY}
      RequireInvitation:                    ${REQUIRE_INVITATION}
      InitialAdmin__Email:                  ${INITIAL_ADMIN_EMAIL}
      InitialAdmin__Password:               ${INITIAL_ADMIN_PASSWORD}
      OpenIddict__KeyDir:                   /openiddict-keys
    volumes:
      - openiddict_keys:/openiddict-keys
    ports:
      - "8080:8080"
    networks:
      - default
      - fishlover_local
    depends_on:
      usermanagement-db:
        condition: service_healthy
      usermanagement-redis:
        condition: service_healthy

volumes:
  usermanagement_sqldata:
  openiddict_keys:

networks:
  fishlover_local:
    external: true
