version: "3.9"

# ────────────────────────────────────────────────────────────────
# FishLover Local Full Stack
# Tương đương docker-compose.prod.yml nhưng dùng local builds + MinIO
# Cần .env cùng thư mục (copy từ .env.example)
# ────────────────────────────────────────────────────────────────

services:

  # ── UserManagement ────────────────────────────────────────────────
  usermanagement-db:
    image: postgres:16-alpine
    container_name: usermanagement_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       UserManagement
      POSTGRES_USER:     usermanagement
      POSTGRES_PASSWORD: "UserMgmt_Local_Pwd1!"
    ports:
      - "5435:5432"
    volumes:
      - usermanagement_sqldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usermanagement -d UserManagement"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishlover_local

  usermanagement-redis:
    image: redis:7-alpine
    container_name: usermanagement_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishlover_local

  usermanagement-api:
    build:
      context: ../../BackEndProject
      dockerfile: ../Pipeline/local/UserManagement/Dockerfile.api
    image: usermanagement-api:local
    container_name: usermanagement_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               Docker
      ASPNETCORE_HTTP_PORTS:                "8080"
      ConnectionStrings__DefaultConnection: ${UM_DB_CONN}
      ConnectionStrings__Redis:             ${REDIS_CONN}
      JwtSettings__SecretKey:               ${JWT_SECRET_KEY}
      JwtSettings__Issuer:                  ${JWT_ISSUER}
      JwtSettings__Audience:                ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes:           ${JWT_EXPIRY_MINUTES}
      AutoMigrate__OnStartup:               "true"
      Seeding__SeedInitialAdmin:            ${SEED_INITIAL_ADMIN}
      EmailSettings__Resend__ApiKey:        ${EMAIL_API_KEY}
      RequireInvitation:                    ${REQUIRE_INVITATION}
      InitialAdmin__Email:                  ${INITIAL_ADMIN_EMAIL}
      InitialAdmin__Password:               ${INITIAL_ADMIN_PASSWORD}
      OpenIddict__Issuer:                   http://localhost:5000
      OpenIddict__KeyDir:                   /openiddict-keys
      ASPNETCORE_FORWARDEDHEADERS_ENABLED:  "true"
    volumes:
      - openiddict_keys:/openiddict-keys
    ports:
      - "8080:8080"
    networks:
      - fishlover_local
    depends_on:
      usermanagement-db:
        condition: service_healthy
      usermanagement-redis:
        condition: service_healthy

  # ── FishDex ───────────────────────────────────────────────────────
  fishdex-db:
    image: pgvector/pgvector:pg16
    container_name: fishdex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - fishdex_pgdata:/var/lib/postgresql/data
      - ./FishDex/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishlover_local

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fishdex_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - fishdex_pgadmin:/var/lib/pgadmin
    networks:
      - fishlover_local
    depends_on:
      fishdex-db:
        condition: service_healthy

  fishdex-api:
    build:
      context: ../../BackEndProject
      dockerfile: ../Pipeline/local/FishDex/Dockerfile.api
    image: fishdex-api:local
    container_name: fishdex_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:       Docker
      ASPNETCORE_HTTP_PORTS:        "8080"
      ConnectionStrings__FishDexDb: ${FISHDEX_DB_CONN}
      JwtSettings__SecretKey:       ${JWT_SECRET_KEY}
      JwtSettings__Issuer:          ${JWT_ISSUER}
      JwtSettings__Audience:        ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes:   ${JWT_EXPIRY_MINUTES}
      AuthServer__Url:              ${AUTH_SERVER_URL}
      AuthServer__Authority:        ${AUTH_SERVER_AUTHORITY}
      AuthServer__SwaggerUrl:       ${AUTH_SERVER_SWAGGER_URL}
      Storage__ServiceUrl:          ${FISHDEX_STORAGE_SERVICE_URL}
      Storage__AccessKey:           ${FISHDEX_STORAGE_ACCESS_KEY}
      Storage__SecretKey:           ${FISHDEX_STORAGE_SECRET_KEY}
      Storage__BucketName:          ${FISHDEX_STORAGE_BUCKET}
      Storage__ForcePathStyle:      "false"
    ports:
      - "8081:8080"
    networks:
      - fishlover_local
    depends_on:
      fishdex-db:
        condition: service_healthy
      usermanagement-api:
        condition: service_started

  # ── AquaHome ──────────────────────────────────────────────────────
  aquahome-db:
    image: postgres:16-alpine
    container_name: aquahome_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       AquaHome
      POSTGRES_USER:     aquahome
      POSTGRES_PASSWORD: "AquaHome_Local_Pwd1!"
    ports:
      - "5434:5432"
    volumes:
      - aquahome_sqldata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquahome -d AquaHome"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishlover_local

  aquahome-redis:
    image: redis:7-alpine
    container_name: aquahome_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fishlover_local

  aquahome-api:
    build:
      context: ../../BackEndProject
      dockerfile: ../Pipeline/local/AquaHome/Dockerfile.api
    image: aquahome-api:local
    container_name: aquahome_api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT:               Docker
      ASPNETCORE_HTTP_PORTS:                "8080"
      ConnectionStrings__DefaultConnection: ${AQUAHOME_DB_CONN}
      JwtSettings__SecretKey:               ${JWT_SECRET_KEY}
      JwtSettings__Issuer:                  ${JWT_ISSUER}
      JwtSettings__Audience:                ${JWT_AUDIENCE}
      JwtSettings__ExpiryMinutes:           ${JWT_EXPIRY_MINUTES}
      AuthServer__Url:                      ${AUTH_SERVER_URL}
      AuthServer__Authority:                ${AUTH_SERVER_AUTHORITY}
      Storage__ServiceUrl:                  ${AQUAHOME_STORAGE_SERVICE_URL}
      Storage__AccessKey:                   ${AQUAHOME_STORAGE_ACCESS_KEY}
      Storage__SecretKey:                   ${AQUAHOME_STORAGE_SECRET_KEY}
      Storage__BucketName:                  ${AQUAHOME_STORAGE_BUCKET}
      Storage__Environment:                 ${AQUAHOME_STORAGE_ENV}
      Storage__ForcePathStyle:              "false"
    ports:
      - "8082:8080"
    networks:
      - fishlover_local
    depends_on:
      aquahome-db:
        condition: service_healthy
      aquahome-redis:
        condition: service_healthy
      usermanagement-api:
        condition: service_started

  # ── ApiGateway ────────────────────────────────────────────────────
  apigateway:
    build:
      context: ../../BackEndProject
      dockerfile: ../Pipeline/local/ApiGateway/Dockerfile.api
    image: apigateway:local
    container_name: apigateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_HTTP_PORTS:  "5000"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      JwtSettings__Issuer:    ${JWT_ISSUER}
      JwtSettings__Audience:  ${JWT_AUDIENCE}
      FE_ORIGIN:              ${FE_ORIGIN}
    ports:
      - "5000:5000"
    networks:
      - fishlover_local
    depends_on:
      - usermanagement-api
      - fishdex-api
      - aquahome-api

volumes:
  usermanagement_sqldata:
    external: true
    name: usermanagementlocal_usermanagement_sqldata
  openiddict_keys:
    external: true
    name: usermanagementlocal_openiddict_keys
  fishdex_pgdata:
    external: true
    name: fishdexlocal_fishdex_pgdata
  fishdex_pgadmin:
    external: true
    name: fishdexlocal_fishdex_pgadmin
  aquahome_sqldata:
    external: true
    name: aquahomelocal_aquahome_sqldata

networks:
  fishlover_local:
    driver: bridge
